[workspace.package]
version = "55.0.0+axon.1"
homepage = "https://datafusion.apache.org/python"
repository = "https://github.com/apache/datafusion-python"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
description = "Apache DataFusion DataFrame and SQL Query Engine"
readme = "README.md"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"

[workspace]
members = ["crates/core", "crates/util", "examples/datafusion-ffi-example"]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1.52" }
pyo3 = { version = "0.29" }
pyo3-async-runtimes = { version = "0.29" }
pyo3-log = "0.13.3"
chrono = { version = "0.4", default-features = false }
arrow = { version = "59" }
arrow-array = { version = "59" }
arrow-schema = { version = "59" }
arrow-select = { version = "59" }
datafusion = { version = "55.0.0" }
datafusion-substrait = { version = "55.0.0" }
datafusion-proto = { version = "55.0.0" }
datafusion-ffi = { version = "55.0.0" }
datafusion-catalog = { version = "55.0.0", default-features = false }
datafusion-common = { version = "55.0.0", default-features = false }
datafusion-functions-aggregate = { version = "55.0.0" }
datafusion-functions-window = { version = "55.0.0" }
datafusion-spark = { version = "55.0.0" }
datafusion-expr = { version = "55.0.0" }
prost = "0.14.3"
serde_json = "1"
uuid = { version = "1.23" }
mimalloc = { version = "0.1", default-features = false }
async-trait = "0.1.89"
futures = "0.3"
cstr = "0.2"
object_store = { version = "0.14.1" }
url = "2"
log = "0.4.29"
parking_lot = "0.12"
prost-types = "0.14.3"                                                       # keep in line with `datafusion-substrait`
pyo3-build-config = "0.29"
datafusion-python-util = { path = "crates/util", version = "55.0.0+axon.1" }

[profile.release]
lto = "thin"
codegen-units = 2

# We cannot publish to crates.io with any patches in the below section. Developers
# must remove any entries in this section before creating a release candidate.
